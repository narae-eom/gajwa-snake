<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbf3d6">
<title>가좌 스네이크 실시간 랭킹 보드</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="board.css">
</head>
<body>
<div class="tools">
  <button id="fullscreen" class="tool">전체화면</button>
  <button id="scope-toggle" class="tool" hidden>전체 랭킹</button>
  <button id="change" class="tool" hidden>반 바꾸기</button>
</div>

<div id="board" class="board" hidden>
  <header class="head">
    <h1 id="title">실시간 랭킹</h1>
    <div class="clock-box">
      <b id="clock">00:00:00</b>
      <span id="participants">참여 0명</span>
    </div>
  </header>
  <main class="body">
    <section class="panel top">
      <h2 id="top-title">TOP 10</h2>
      <ol id="top-list" class="top-list"></ol>
      <p id="top-empty" class="empty" hidden>아직 기록이 없어요. 첫 번째 주인공은 누구?</p>
    </section>
    <section class="panel battle">
      <h2 id="battle-title">반 대항전 <small>(평균 최고점)</small></h2>
      <div id="battle-list" class="battle-list"></div>
    </section>
  </main>
  <section class="panel recent">
    <span class="recent-tag">방금 기록</span>
    <div id="recent-list" class="recent-list"><p class="recent-empty">기록을 기다리는 중…</p></div>
  </section>
  <p class="status"><i id="dot"></i><span id="status-text">연결 중…</span></p>
</div>

<section id="picker" class="picker" hidden aria-labelledby="picker-title">
  <h2 id="picker-title">어느 랭킹을 띄울까요?</h2>
  <button class="pick pick-all" data-view="all">우리 학교 전체 랭킹</button>
  <div id="picker-grades" class="picker-grades"></div>
  <a class="picker-back" href="./">← 게임 입장 화면</a>
</section>

<script src="config.js"></script>
<script type="module" src="board.mjs"></script>
</body>
</html>
