<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4a762c">
<meta name="description" content="가좌중학교 스네이크 게임 입장. 학번과 이름을 입력하세요.">
<title>가좌 스네이크 · 입장</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body class="entry-body">
<main class="entry">
  <section class="entry-card" aria-labelledby="entry-title">
    <div class="entry-hero" aria-hidden="true">
      <svg viewBox="0 0 220 90" class="hero-snake">
        <path d="M18 62H112Q132 62 132 42V36Q132 22 146 22H176" fill="none" stroke="#416de4" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="181" cy="17" r="5.5" fill="#fff"/><circle cx="181" cy="29" r="5.5" fill="#fff"/>
        <circle cx="183" cy="17" r="2.8" fill="#263b7c"/><circle cx="183" cy="29" r="2.8" fill="#263b7c"/>
        <path d="M206 50C196 42 192 66 203 70C215 70 216 44 206 50" fill="#ed5144"/><path d="M205 49L207 42" stroke="#70572d" stroke-width="2.5"/>
      </svg>
    </div>
    <span class="eyebrow">GAJWA MIDDLE SCHOOL</span>
    <h1 id="entry-title">가좌 스네이크</h1>
    <p class="entry-lead">학번과 이름을 입력하고 게임을 시작하세요.</p>
    <form id="entry-form" novalidate>
      <label for="student-id">학번</label>
      <input id="student-id" name="studentId" required inputmode="numeric" maxlength="5" autocomplete="off" placeholder="예: 10203" aria-describedby="id-preview">
      <p id="id-preview" class="id-preview" aria-live="polite">학번 5자리 = 학년 1자리 + 반 2자리 + 번호 2자리</p>
      <label for="student-name">이름</label>
      <input id="student-name" name="name" required maxlength="20" autocomplete="off" placeholder="이름을 입력하세요">
      <p class="privacy-note">입력한 학번과 이름이 랭킹에 그대로 표시됩니다. 꼭 본인 정보로 입력해 주세요.</p>
      <p id="entry-error" class="entry-error" role="alert"></p>
      <button type="submit" class="primary entry-submit">게임 시작하기</button>
    </form>
    <a class="board-link" href="board.html">실시간 랭킹 보드 보기 →</a>
  </section>
  <p class="entry-foot">사과 1개 = 1점 · 개인 최고점으로 랭킹이 정해져요 · 중도 종료한 판은 저장되지 않아요</p>
</main>
<script src="config.js"></script>
<script type="module" src="entry.mjs"></script>
</body>
</html>
