<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4a762c">
<title>가좌 스네이크 · 게임</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  // Without a student profile there is nothing to save; go back to the entry form before rendering.
  try { if (!sessionStorage.getItem('gajwa-snake-profile')) location.replace('./'); } catch { location.replace('./'); }
</script>
</head>
<body class="play-body">
<header class="site-header">
  <a class="brand" href="./" aria-label="가좌 스네이크 입장 화면">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 29V15Q9 9 16 9H24Q31 9 31 16V23" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><circle cx="29" cy="20" r="2" fill="#fff"/></svg>
    <span>가좌 <strong>스네이크</strong><small>GAJWA MIDDLE SCHOOL</small></span>
  </a>
  <div class="header-right">
    <div class="student-chip"><b id="profile-name">-</b><span id="profile-detail"></span></div>
    <a class="chip-link" id="board-link" href="board.html?v=20261007-4" target="_blank" rel="noopener">랭킹 보드</a>
    <button id="change-profile" class="chip-link">학생 변경</button>
  </div>
</header>
<main class="play-main">
  <div class="game-frame" id="game" tabindex="0" role="group" aria-label="스네이크 게임판. 방향키 또는 WASD로 조작합니다.">
    <div class="game-bar">
      <div class="score-cell"><svg viewBox="0 0 30 32" aria-label="점수" role="img"><path d="M15 10C2 0 0 26 13 29C27 29 29 1 15 10" fill="#ed5144"/><path d="M15 9L17 2" stroke="#70572d" stroke-width="3"/><ellipse cx="23" cy="5" rx="6" ry="3" fill="#9cce58"/></svg><span id="score">0</span></div>
      <div class="best-cell"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M8 4H22V12Q22 19 15 19Q8 19 8 12Z M8 7H3Q3 14 9 14 M22 7H27Q27 14 21 14" fill="#f5c542" stroke="#f5c542" stroke-width="1.5"/><rect x="12" y="19" width="6" height="5" fill="#f5c542"/><rect x="9" y="24" width="12" height="3" rx="1" fill="#f5c542"/></svg><span>내 최고</span><b id="best">-</b></div>
      <span class="game-state" id="game-state">준비</span>
      <button id="sound" class="bar-button" aria-label="소리 켜기" aria-pressed="false">소리 꺼짐</button>
      <button id="fullscreen" class="bar-button" aria-label="게임 전체 화면">전체 화면</button>
    </div>
    <div class="board-wrap">
      <canvas id="board" width="680" height="600" aria-label="17열 15행 게임판"></canvas>
      <div class="board-overlay" id="overlay">
        <div class="overlay-card">
          <span class="overlay-kicker" id="overlay-kicker">READY</span>
          <h2 id="overlay-title">준비됐나요?</h2>
          <p id="overlay-description">Enter·스페이스바 또는 시작하기로 게임판을 연 뒤, 방향키를 눌러 출발하세요.</p>
          <button id="play" class="primary">시작하기</button>
          <p class="overlay-foot" id="overlay-foot">Enter 또는 스페이스바 · 시작하기 클릭</p>
        </div>
      </div>
    </div>
  </div>
  <div class="under-game">
    <p id="save-state" role="status" aria-live="polite">Enter 또는 스페이스바로 준비 화면을 닫아 주세요.</p>
    <div><button id="retry-save" class="text-button" hidden>저장 다시 확인</button> <button id="abort" class="text-button" disabled>중도 종료</button></div>
  </div>
  <div class="key-guide">
    <span><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span>
    <span><kbd>Enter</kbd> / <kbd>Space</kbd> 준비 화면 닫기 · 다시 준비</span>
    <span><kbd>Esc</kbd> 중도 종료 · 저장 안 됨</span>
  </div>
  <p class="game-note">벽과 몸을 피하고 사과를 먹어 보세요. 다른 탭으로 이동하면 중도 종료되어 저장되지 않습니다.</p>
</main>
<script src="config.js?v=20261007-2"></script>
<script type="module" src="app.mjs?v=20261007-5"></script>
</body>
</html>
